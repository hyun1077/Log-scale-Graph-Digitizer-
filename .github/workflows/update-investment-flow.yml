name: Update Investment Flow Data

on:
  schedule:
    - cron: '40 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update investment flow registry and scores
        run: python scripts/update_investment_flow.py
      - name: Commit changed investment data
        run: |
          if git diff --quiet -- log-digitizer-vite/public/capital-flow/investment-flow.json log-digitizer-vite/public/capital-flow/data.json; then
            echo "No investment data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log-digitizer-vite/public/capital-flow/investment-flow.json log-digitizer-vite/public/capital-flow/data.json
          git commit -m "update investment flow data"
          git push
