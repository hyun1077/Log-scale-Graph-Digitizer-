name: Update US Capital Flow Data

on:
  schedule:
    - cron: '20 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update official liquidity data
        run: python scripts/update_capital_flow.py
      - name: Update stock signals and news
        run: python scripts/update_stock_signals.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- log-digitizer-vite/public/capital-flow/data.json log-digitizer-vite/public/capital-flow/stocks.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log-digitizer-vite/public/capital-flow/data.json log-digitizer-vite/public/capital-flow/stocks.json
          git commit -m "update capital flow and stock signals"
          git push
