<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>Thinking Lab | Stock Signals</title><style>:root{--bg:#07101d;--p:#0d1929;--line:#20334d;--txt:#edf4ff;--muted:#8fa5bf;--a:#4fd1c5;--g:#62d98f;--r:#ff6b7a;--y:#ffb454}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#173456 0,#07101d 38%);color:var(--txt);font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:0 12px 88px}.top{padding:24px 4px 14px}.label{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--a)}h1{font-size:28px;margin:7px 0}.sub{color:var(--muted);font-size:13px;line-height:1.55}.card{background:linear-gradient(145deg,#101f33,var(--p));border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.stock{border:1px solid var(--line);border-radius:15px;padding:15px;background:#ffffff05;margin-top:10px}.head{display:flex;justify-content:space-between;gap:12px}.ticker{font-size:22px;font-weight:800}.price{font-size:20px;font-weight:800;text-align:right}.signal{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:999px;border:1px solid #ffffff18;font-size:10px;font-weight:800}.strong{color:var(--g)}.watch{color:var(--y)}.weak,.error{color:var(--r)}.score{font-size:32px;font-weight:800;margin:12px 0 5px}.conds{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.cond{font-size:12px;padding:8px;border-radius:10px;background:#ffffff06;border:1px solid #ffffff0d}.pass{color:var(--g)}.fail{color:var(--muted)}.issues{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.issue{padding:8px 0}.issue a{color:var(--txt);text-decoration:none;font-size:12px;line-height:1.45}.issue small{display:block;color:var(--muted);margin-top:3px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}.nav{position:fixed;left:0;right:0;bottom:0;background:#091321ed;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.nav a{color:var(--muted);text-decoration:none;font-size:11px}.nav b{display:block;color:var(--txt);font-size:16px;text-align:center}@media(max-width:620px){.conds{grid-template-columns:1fr}.wrap{padding-left:10px;padding-right:10px}}</style></head><body><div class="wrap"><header class="top"><div class="label">THINKING LAB</div><h1>Stock Signals</h1><div class="sub">어떤 조건을 만족했는지 + 최근 이슈를 한 번에 확인</div></header><section class="card"><div class="label">SCANNER RULE</div><h2>5개 조건</h2><div class="sub">① 주가 > 20일선 · ② 20일선 > 60일선 · ③ 52주 고점 -10% 이내 · ④ 20일 수익률이 S&P500보다 강함 · ⑤ 거래량 > 20일 평균</div></section><section class="card"><div class="label">TODAY'S MATCHES</div><div class="sub" id="updated">데이터 로딩 중...</div><div id="stocks"></div></section></div><nav class="nav"><a href="./"><b>◎</b>Capital Flow</a><a href="./stocks.html"><b>★</b>Stock Signals</a></nav><script>function signalKo(s){return s==='strong'?'강한 신호':s==='watch'?'관찰':s==='weak'?'약함':'데이터 오류'}function fmt(x){return x==null?'-':x}fetch('./stocks.json?'+Date.now()).then(r=>r.json()).then(d=>{updated.textContent=d.updatedAt?'업데이트: '+new Date(d.updatedAt).toLocaleString('ko-KR'):'첫 자동 업데이트 대기 중';if(!d.items.length){stocks.innerHTML='<div class="sub" style="padding:18px 0">첫 GitHub Actions 실행 후 종목 신호가 표시됩니다.</div>';return}stocks.innerHTML=d.items.sort((a,b)=>(b.passed||0)-(a.passed||0)).map(x=>{if(x.error)return `<div class="stock"><div class="ticker">${x.ticker}</div><span class="signal error">데이터 오류</span><div class="sub">${x.error}</div></div>`;return `<article class="stock"><div class="head"><div><div class="ticker">${x.ticker}</div><span class="signal ${x.signal}">${signalKo(x.signal)}</span></div><div class="price">$${x.price}</div></div><div class="score">${x.passed}/${x.total} 조건 만족</div><div class="stats"><span>20일 ${x.return20}%</span><span>SPY ${x.spyReturn20}%</span><span>거래량 ${fmt(x.volumeRatio)}x</span><span>52주 고점 $${x.high52}</span></div><div class="conds">${x.conditions.map(c=>`<div class="cond ${c.pass?'pass':'fail'}">${c.pass?'✓':'○'} ${c.label}</div>`).join('')}</div><div class="issues"><div class="label">RECENT ISSUES · 7D</div>${x.news.length?x.news.map(n=>`<div class="issue"><a href="${n.link}" target="_blank">${n.title}</a><small>${n.published||''}</small></div>`).join(''):'<div class="sub">최근 뉴스 없음</div>'}</div></article>`}).join('')}).catch(e=>{updated.textContent='데이터 로딩 오류';stocks.innerHTML='<div class="sub">'+e.message+'</div>'})</script></body></html>
